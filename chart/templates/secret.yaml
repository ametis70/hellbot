{{/*
secret.yaml — chart-managed Secret for inline sensitive values.

Only rendered when at least one sensitive field uses a plain string value.
Fields that use existingSecret references are not included here — they are
projected directly from the user's own Secret in the Deployment volume.
*/}}
{{- if eq (include "hellbot.hasInlineSecrets" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hellbot.fullname" . }}
  labels:
    {{- include "hellbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range (include "hellbot.secretFields" . | fromJson).items }}
  {{- if .inlineValue }}
  {{ .filePath }}: {{ .inlineValue | quote }}
  {{- end }}
  {{- end }}
{{- end }}
